# Ubuntu 24.04 server. Both images come from docker load, not from a build on this machine.
# nginx.conf is mounted over the image config. It proxies /api, /media, and /static
# to the hostname "backend", which is this service, so both containers must stay in this file.

name: chatbot

services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: chatbot-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_DB_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /data/static
      APPROVED_FOLDER_ROOTS: /approved_folders
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - backend_data:/data
      - ./approved_folders:/approved_folders
      - ./backend/.env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8010}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/system/health/", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  frontend:
    image: chatbot-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${UI_PORT:-3010}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/system/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  backend_data:
  qdrant_data:
