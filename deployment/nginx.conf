server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Docker's DNS. A literal upstream name is resolved once at startup, and
    # nginx exits when that lookup fails (common when IPv6 is disabled).
    # A variable is resolved per request, and ipv6=off keeps AAAA failures
    # from hiding the IPv4 address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Keep the https scheme set by Nginx on the Ubuntu host.
    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /media/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $http_host;
    }

    location /static/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $http_host;
    }

    location = /widget.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri $uri/ /index.html;
    }
}
